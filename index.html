<!doctype html>

          <span class="city-building building-three"></span>

          <span class="city-building building-seven"></span>

            <div class="rule"></div>
            <p class="contact-label">ME ENCONTRE NO XAT</p>
            <a class="xat-link" href="https://beta.xat.com/thestore" target="_blank" rel="noopener noreferrer"><img class="xat-icon" src="images/xat.pg.png" alt=""><span><strong>thestore</strong><small>beta.xat.com/thestore</small></span><span class="link-arrow">↗</span></a>
            <div class="social-icons" aria-label="Redes sociais">
              <span class="social-tip" tabindex="0" aria-label="Instagram: peça diretamente para mim.">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="social-dot" cx="17.5" cy="6.5" r="1"/></svg><span class="tooltip">peça diretamente para mim.</span>
              </span>

                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.2 18-4.1-7.1L3 10.1 21 3Z"/><path d="m9.7 13.9 4.7-4.6"/></svg><span class="tooltip">peça diretamente para mim.</span>
              </span>
            </div>
          </section>
          <section class="music" aria-label="Reprodutor de música">
            <div class="music-top"><span class="section-label">MINHA TRILHA</span><span class="music-symbol">♫</span></div>
